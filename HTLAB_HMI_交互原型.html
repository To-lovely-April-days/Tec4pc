<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTLAB 双通道平行合成反应主机 · HMI 交互原型（1280×720）</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
    :root{
  /* ══ 主题青 #4FB1B8 / 浅底 #E4F4F4 ══ */
  --blue:#4FB1B8; --blue-l:#E4F4F4; --blue-d:#2F8189; --on-blue:#0D3236;
  --brandhi:#6FC3C9; --brandlo:#215F65;
  /* 状态色：品牌不再占红，报警红可退回更深更稳的 #C42B1C（白字 5.70:1） */
  --green:#2F6B38; --green-l:#E6EEE7; --red:#C42B1C; --amber:#C88A00;
  --rail:#F1F1F1; --rail-ln:#CCCCCC; --bg:#F1F1F1; --card:#FFFFFF;
  --frame:#CCCCCC; --line:#DCDCDC; --line2:#ECECEC;
  --dark:#3A3A3A; --vbox:#DCDCDC; --ink:#1A1A1A; --mut:#6F6F6F; --mut2:#C9C9C9;
  --v-ln:#4A4A4A; --v-liq:#16EDFF; --v-shell:#ECECEC; --v-hi:#F9F9F9; --v-surf:#0C8E9E;
  --pnh1:#FDFDFD; --pnh2:#F6F6F6; --tab:#F1F1F1; --tabh:#E6E6E6; --glass:#FFFFFF;
  --s1:#2F8189; --s2:#4A4A4A; --s3:#8E8E8E; --s4:#C9C9C9;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;
  --ez:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(ellipse at 50% 34%,#4C4C4C 0,#2E2E2E 62%,#242424 100%);font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;
  margin:0;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;user-select:none}
.fit{transform-origin:center center;flex:none}
/* ══ 屏体外壳 ══ */
.device{width:1372px;flex:none;position:relative;border-radius:16px;
  background:linear-gradient(180deg,#4A4A4A 0,#2E2E2E 5%,#2B2B2B 52%,#242424 100%);
  box-shadow:0 28px 70px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.07) inset,
             0 -2px 0 rgba(0,0,0,.5) inset, 0 0 0 1px #171717;}
.bz-top{height:46px;display:flex;align-items:center;padding:0 30px}
.brand{display:flex;align-items:center;gap:10px;color:#EAEAEA;font-size:15px;font-weight:700;letter-spacing:3.4px}
.brand i{width:13px;height:13px;background:var(--blue);display:block;border-radius:2px;
  box-shadow:0 0 9px rgba(79,177,184,.75)}
.model{margin-left:auto;color:#8E8E8E;font-size:11.5px;letter-spacing:.6px}
.glass{margin:0 46px;padding:5px;border-radius:4px;background:#121212;position:relative;
  box-shadow:inset 0 0 0 1px #000000, 0 0 0 1px rgba(255,255,255,.06), inset 0 3px 9px rgba(0,0,0,.65)}
.glare{position:absolute;inset:5px;border-radius:2px;pointer-events:none;
  background:linear-gradient(116deg,rgba(255,255,255,.10) 0 15%,rgba(255,255,255,.02) 30%,rgba(255,255,255,0) 46%)}
.bz-bot{height:64px;display:flex;align-items:center;padding:0 30px;gap:24px}
.leds{display:flex;align-items:center;gap:7px;color:#8E8E8E;font-size:11px;letter-spacing:.4px}
.leds .led{width:9px;height:9px;border-radius:50%;background:#3D3D3D;display:block;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.7)}
.leds .led:not(:first-child){margin-left:11px}
.led.pw{background:var(--blue);box-shadow:0 0 9px rgba(79,177,184,.95)}
.led.run{background:#2E7D32;box-shadow:0 0 9px rgba(46,125,50,.9)}
.cap{margin-left:auto;color:#6F6F6F;font-size:11px;letter-spacing:.4px}
.ports{display:flex;gap:7px;margin-left:22px}
.usb{width:17px;height:8px;border-radius:1.5px;background:#1C1C1C;display:block;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.05)}
.scr{position:absolute;width:9px;height:9px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#6F6F6F,#3A3A3A 60%,#242424);
  box-shadow:0 1px 1px rgba(255,255,255,.06)}
.scr.tl{left:16px;top:16px}.scr.tr{right:16px;top:16px}
.scr.bl{left:16px;bottom:16px}.scr.br{right:16px;bottom:16px}
.device.bare{background:none;box-shadow:none;border-radius:0}
.device.bare .bz-top,.device.bare .bz-bot,.device.bare .scr,.device.bare .glare{display:none}
.device.bare .glass{margin:0;padding:0;background:none;box-shadow:none}
.device.bare .pad0{border:1px solid #242424;box-shadow:0 14px 40px rgba(0,0,0,.4)}

button{font-family:var(--sans);cursor:pointer;border:0;background:none;color:inherit}
.pad0{width:1280px;height:720px;background:var(--card);flex:none;
  display:grid;grid-template-columns:80px 1fr;transform-origin:top center;position:relative;overflow:hidden}


/* ══ 侧栏（Mya） ══ */
.rail{background:var(--rail);border-right:1px solid var(--rail-ln);display:flex;flex-direction:column;align-items:center}
.rbtn{width:79px;height:72px;display:flex;align-items:center;justify-content:center;position:relative;--icbg:#F1F1F1}
.rbtn:hover{background:#EAEAEA;--icbg:#EAEAEA}
.rbtn.on{background:var(--blue);--icbg:var(--blue)}
/* 图标液体:颜色即信息——默认中性灰,仅运行中的通道亮 --v-liq;选中态下待机为半透明白 */
.liq{fill:var(--mut2)}
.rbtn.run .liq{fill:var(--v-liq)}
.rbtn.on .liq{fill:rgba(255,255,255,.5)}
.rbtn.on.run .liq{fill:var(--v-liq)}
svg rect[data-fedit]{transition:stroke .12s}
svg rect[data-fedit]:hover{stroke:var(--blue)}
.rbtn svg{width:25px;height:25px;fill:none;stroke:#4C4C4C;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.rbtn.on svg{stroke:#FFF} .rbtn.on .n{color:#FFF}
.rbtn .n{position:absolute;top:9px;right:12px;font-size:11px;font-weight:700;color:#4C4C4C;line-height:1}
.rbtn.run::after{content:"";position:absolute;top:12px;left:13px;width:7px;height:7px;
  border-radius:50%;background:var(--green)}
.rbtn.on.run::after{background:#8FDC96;box-shadow:0 0 0 1.5px rgba(255,255,255,.4)}
.rail{padding:8px 0;align-items:center;gap:0}
.rsep{width:34px;height:1px;background:#DCDCDC;margin:5px 0;flex:none}

.rspace{flex:1}
.rstate{width:79px;padding:11px 0;background:var(--blue-d);color:#FFF;text-align:center;font-size:12px;font-weight:700;letter-spacing:1.1px}
.rstate.idle{background:#C9C9C9;color:var(--ink)}

/* ══ 屏幕（Mya） ══ */
.screen{display:flex;flex-direction:column;padding:8px 10px 6px;min-width:0}
.topbar{display:flex;align-items:flex-end;gap:4px;height:46px;flex:none;padding-left:8px}
.tab{height:40px;padding:0 17px 0 9px;gap:9px;border:1px solid var(--frame);border-radius:3px 3px 0 0;background:var(--tab);
  font-size:13.5px;color:#3D3D3D;display:flex;align-items:center}
.tab:hover{background:var(--tabh)}
.tab.on{background:var(--card);border-color:var(--frame);border-bottom-color:var(--card);margin-bottom:-1px;height:42px;
  font-weight:500;box-shadow:inset 0 2px 0 var(--blue)}
.tic{width:26px;height:26px;border:1px solid #C9C9C9;border-radius:3px;background:#FFF;--icbg:#FFF;
  display:flex;align-items:center;justify-content:center;flex:none;transition:.15s var(--ez)}
.tab.on .tic{background:var(--blue);border-color:var(--blue);--icbg:#4FB1B8;box-shadow:0 1px 4px rgba(79,177,184,.34)}
.tab.on .tic svg{stroke:var(--on-blue)}
.tic svg{width:16px;height:16px;fill:none;stroke:#4A4A4A;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;transition:stroke .15s}
.topbar .rt{margin-left:auto;align-self:center;padding-bottom:4px;font-size:11.5px;color:var(--mut)}
.stage{flex:1;border:1px solid var(--frame);border-radius:3px;padding:12px;min-height:0;
  display:flex;flex-direction:column;gap:10px}

/* ══ 总览通道卡（Mya） ══ */
.zones{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0,1fr);gap:34px;min-height:0}
.zone{display:flex;flex-direction:column;min-width:0;min-height:0}
.zhead{height:62px;border:1px solid #C9C9C9;border-radius:3px;background:#FFF;padding:9px 13px 11px;
  display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden;flex:none}
.zhead:hover{border-color:var(--blue)}
.zhead .row1{display:flex;align-items:baseline;gap:9px;min-width:0;height:21px}
.zhead .dot{width:7px;height:7px;border-radius:50%;background:#C9C9C9;flex:none;align-self:center}
.zhead.run .dot{background:var(--green)}
.zhead .ch{font-size:10.5px;color:var(--mut);flex:none;letter-spacing:.4px}
.zhead .row1 b{font-size:15px;font-weight:700;line-height:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zhead .row1 .rt{margin-left:auto;font-size:13.5px;font-weight:500;flex:none;letter-spacing:.3px}
.zhead:not(.run) .row1 .rt{color:var(--mut);font-size:12px}
.zhead .row2{display:flex;font-size:11px;line-height:16px;color:#6F6F6F;gap:9px;min-width:0;height:16px}
.zhead .row2 span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zhead .row2 .rt{margin-left:auto;flex:none}
.zhead .pg{position:absolute;left:0;right:0;bottom:0;height:4px;background:#F1F1F1;display:block}
.zhead .pg b{display:block;height:100%;background:var(--blue);transition:width .5s}
.art{flex:1;min-height:0;position:relative;margin-top:10px;overflow:hidden}
.art svg{position:absolute;inset:5% 0;width:100%;height:90%;overflow:visible}

.pvl{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.bub{position:absolute;border:2px solid #B4B4B4;border-radius:3px;background:#FFF;padding:4px 10px;line-height:1.18}
.bub .l1{font-size:15px} .bub .tag{font-size:10.5px;color:var(--mut);margin-right:6px;vertical-align:1px}
.bub .l2{font-size:10px;color:var(--mut);margin-top:2px}
.bub.hi{border-color:var(--blue)} .bub.hi .tag{color:var(--blue-d)}
.rpanel{height:156px;background:var(--dark);border-radius:3px;margin-top:10px;flex:none;
  padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px 15px}
.read{display:flex;align-items:center;gap:9px}
.read .ic{width:22px;flex:none;display:flex;justify-content:center}
.read .ic svg{width:20px;height:24px;fill:none;stroke:#FFF;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.vbx{flex:1;min-width:0;height:38px;border:1px solid #B4B4B4;border-radius:3px;background:var(--vbox);
  padding:0 10px;font-size:15.5px;display:flex;align-items:center;gap:6px}
.vbx .tag{font-size:11px;color:#6F6F6F;flex:none} .vbx .u{font-size:11.5px;color:#6F6F6F}
.vbx .note{font-size:10.5px;color:#6F6F6F;margin-left:auto;flex:none}
.vbx.hi{border:2px solid var(--blue);background:#FFF} .vbx.hi .tag{color:var(--blue-d)}
.vbx.off{color:#6F6F6F;background:#A3A3A3}
.vbx.off .tag,.vbx.off .u,.vbx.off .note{color:#6F6F6F}
.tile,.grid2,.badge{display:none}

/* ══ 通道控制（Mya） ══ */
.hd{height:72px;border:1px solid #C9C9C9;border-radius:3px;background:#FFF;padding:9px 10px 12px 13px;
  display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden;flex:none}
.hd .row1{display:flex;align-items:center;gap:9px;min-width:0;height:28px}
.hd .dot{width:7px;height:7px;border-radius:50%;background:#C9C9C9;flex:none}
.hd.run .dot{background:var(--green)}
.hd .ch{font-size:10.5px;color:var(--mut);flex:none;letter-spacing:.4px}
.hd .row1 b{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .star{font-style:normal;color:var(--amber);margin-left:3px}
.hd .row1 .rt{margin-left:auto;font-size:11.5px;color:#6F6F6F;flex:none}
.hd .row1 .rt em{font-style:normal;font-size:13.5px;font-weight:500;color:var(--ink);letter-spacing:.3px}
.hd .row2{display:flex;font-size:11px;line-height:16px;color:#6F6F6F;gap:9px;min-width:0;height:16px;padding-right:2px}
.hd .row2 span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .row2 .rt{margin-left:auto;flex:none}
.hd .pg{position:absolute;left:0;right:0;bottom:0;height:4px;background:#F1F1F1;display:block}
.hd .pg b{display:block;height:100%;background:var(--blue);transition:width .5s}
.hbtn{height:28px;padding:0 14px;border:1px solid #B4B4B4;background:#F1F1F1;border-radius:3px;
  font-size:12.5px;color:#3A3A3A;flex:none;margin-left:10px}
.hbtn:hover{background:#EAEAEA}
.hbtn.danger{border-color:var(--red);background:#FBEBE9;color:#9B2115}
.hbtn.go{border-color:var(--blue);background:var(--blue);color:var(--on-blue)}
.main{flex:1;display:flex;gap:12px;min-height:0}
.artpane{display:flex;flex:none;width:404px;min-width:0;transition:width .18s}
.artpane.closed{width:28px}
.ptab{width:28px;flex:none;background:#F1F1F1;border:1px solid #C9C9C9;border-right:0;border-radius:3px 0 0 3px;
  display:flex;flex-direction:column;align-items:center;padding-top:8px;gap:10px;cursor:pointer}
.ptab:hover{background:#EAEAEA}
.artpane.closed .ptab{border-right:1px solid #C9C9C9;border-radius:3px}
.ptab .pc{width:19px;height:19px;border:1.5px solid #6F6F6F;border-radius:50%;display:grid;place-items:center;
  font-size:9px;color:#4C4C4C;flex:none}
.ptab .pv{writing-mode:vertical-rl;font-size:12px;color:#4C4C4C;letter-spacing:1.5px}
.artbox{flex:1;min-width:0;position:relative;border:1px solid var(--line);border-radius:0 3px 3px 0;background:#FBFBFB;overflow:hidden}
.artpane.closed .artbox{display:none}
.artbox svg{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);overflow:visible}
.ctl{flex:1;display:flex;flex-direction:column;gap:9px;min-width:0}
.modes{display:flex;height:46px;border:1px solid #B4B4B4;border-radius:3px;overflow:hidden;flex:none}
.modes button{flex:1;border-right:1px solid #C9C9C9;background:#F1F1F1;font-size:13px;color:#3A3A3A;line-height:1.25}
.modes button:last-child{border-right:0}
.modes button:hover{background:#EAEAEA}
.modes button.on{background:var(--blue);color:var(--on-blue);font-weight:500}
.modes button[disabled]{opacity:.38;cursor:default}
.modes small{display:block;font-size:9.5px;opacity:.7}
.cd{border:1px solid #C9C9C9;border-radius:3px;padding:9px 12px 11px;flex:none}
.ch{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.ch b{font-size:13px;font-weight:700;letter-spacing:.2px}
.ch em{font-style:normal;font-size:10.5px;color:var(--mut)}
.sw{margin-left:8px;display:flex;align-items:center;gap:7px;border:1px solid #B4B4B4;border-radius:3px;
  background:#F1F1F1;padding:4px 6px 4px 11px;font-size:11.5px;color:#6F6F6F}
.sw:first-of-type{margin-left:auto}
.sw i{width:33px;height:19px;border-radius:10px;background:var(--mut2);position:relative;display:block;transition:.15s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#FFF;transition:left .15s}
.sw.on{color:var(--ink)} .sw.on i{background:var(--blue)} .sw.on i::after{left:16px}
.row{display:flex;align-items:flex-end;gap:11px;flex-wrap:wrap}
.fd label{display:block;font-size:10.5px;color:var(--mut);margin-bottom:3px}
.vb{height:44px;min-width:104px;border:2px solid #B4B4B4;border-radius:3px;background:#F1F1F1;
  display:flex;align-items:center;justify-content:flex-end;gap:5px;padding:0 11px}
.vb:hover{border-color:var(--blue)}
.vb b{font-size:21px;font-weight:500} .vb u{text-decoration:none;font-size:11px;color:var(--mut)}
.vb.sm{height:34px;min-width:72px} .vb.sm b{font-size:15px}
.vb.edit{border-color:var(--amber);background:#FDF6EA} .vb.edit b{color:var(--amber)}
.pend{font-size:9.5px;color:var(--amber);margin-top:3px;display:block}
.rad{display:flex;gap:11px;font-size:11.5px;color:#6F6F6F;align-items:center;height:44px}
.rad span{display:flex;align-items:center;gap:5px}
.rad i{width:14px;height:14px;border:2px solid var(--mut2);border-radius:50%;display:block;position:relative}
.rad i.on{border-color:var(--blue)}
.rad i.on::after{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--blue)}
.now{margin-left:auto;text-align:right;font-size:11px;color:#6F6F6F;line-height:1.6}
.now b{font-size:13.5px;color:var(--ink);font-weight:500}
.acts{display:flex;gap:7px}
.ab{flex:1;height:44px;border:1px solid #B4B4B4;background:#F1F1F1;border-radius:3px;font-size:12.5px;color:#2E2E2E;line-height:1.25}
.ab:hover{background:#EAEAEA}
.ab small{display:block;font-size:9.5px;color:var(--mut)}
.ab.mark{border-color:var(--blue);color:var(--blue-d);background:var(--blue-l)}
.lastlog{font-size:10.5px;color:var(--mut);margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot{height:54px;border:1px solid #C9C9C9;border-radius:3px;display:flex;align-items:center;gap:10px;
  padding:0 12px;flex:none;background:#F9F9F9}
.lim{display:flex;gap:6px;font-size:10.5px;color:#6F6F6F;flex-wrap:wrap}
.lim span{border:1px solid #DEDEDE;border-radius:3px;padding:4px 9px;background:#FFF}
.btns{margin-left:auto;display:flex;gap:8px}
.bt{height:38px;padding:0 17px;border:1px solid #B4B4B4;background:#F1F1F1;border-radius:3px;font-size:13px;color:#3D3D3D}
.bt:hover{background:#EAEAEA}
.bt.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue);font-weight:500;padding:0 22px}
.bt.pri:hover{background:var(--blue-d)}
.bt[disabled]{color:var(--mut2);background:#F9F9F9;border-color:#DCDCDC;cursor:default}

/* ══ 面板 / 列表 ══ */
.tl{position:relative;padding:11px 13px 7px}
.tlr{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.tlk{width:32px;flex:none;font-size:11px;color:var(--mut);text-align:right}
.tlt{flex:1;display:flex;gap:1px;height:26px;min-width:0}
.seg{position:relative;flex:none;display:flex;align-items:center;justify-content:flex-end;
  padding:0 6px;font-size:11px;border-radius:2px;overflow:hidden;white-space:nowrap}
.seg.tp{background:var(--blue-l);color:var(--blue-d)}
.seg.rp{background:var(--line2);color:var(--ink)}
.seg.past{opacity:.4}
.seg.zip{padding:0}
.seg.zip::after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(135deg,transparent 0 3px,rgba(142,142,142,.32) 3px 4px)}
.tla{flex:1;position:relative;height:17px;min-width:0}
.tla i{position:absolute;top:0;width:1px;height:4px;background:var(--mut2)}
.tla b{position:absolute;top:5px;font-size:10px;font-weight:400;color:var(--mut);
  transform:translateX(-50%);white-space:nowrap}
.tlc{position:absolute;width:2px;background:var(--green);border-radius:1px}
.tlnone{padding:22px 13px;text-align:center;font-size:12px;color:var(--mut)}
.pnl{border:1px solid var(--frame);border-radius:3px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pnh{height:48px;letter-spacing:.2px;display:flex;align-items:center;gap:10px;padding:0 13px;border-bottom:1px solid var(--line);
  font-size:12.5px;font-weight:500;flex:none}
.pnh .sm{font-size:11px;color:var(--mut);font-weight:400}
.pnh .rt{margin-left:auto;display:flex;gap:7px}
.topbar .brand{margin-left:14px;font-size:11px;letter-spacing:.6px;color:var(--mut);white-space:nowrap;align-self:center}
.topbar .rt+.brand,.topbar .sbis+.brand{padding-left:14px;border-left:1px solid var(--line)}
.topbar>.brand:first-of-type{margin-left:auto}
.lst{flex:1;overflow:auto}
.lrow{display:flex;align-items:center;gap:11px;padding:9px 13px;border-bottom:1px solid var(--line2);font-size:12.5px}
.lrow:hover{background:#F6F6F6}
.lrow .k{width:150px;flex:none;color:#6F6F6F}
.lrow .v{color:var(--ink);font-weight:500}
.lrow .d{margin-left:auto;color:var(--mut);font-size:11.5px}
.lrow.sel{background:var(--blue-l);box-shadow:inset 3px 0 0 var(--blue)}
.sbis{display:flex;gap:6px;align-items:center;margin-left:10px;align-self:center;padding-bottom:2px}
.sbi{font-size:10px;font-style:normal;color:#8E8E8E;border:1px solid #DCDCDC;border-radius:2px;padding:2px 6px;letter-spacing:.3px}
.sbi.on{color:var(--blue-d);border-color:#BFE0E2;background:var(--blue-l)}
.sbi.ex{color:var(--green);border-color:#B7CDBB;background:var(--green-l)}
.sbi.rm{color:var(--blue-d);border-color:var(--blue);background:var(--blue-l);font-weight:700;cursor:pointer}
.rtag{font-size:10.5px;padding:2px 8px;border-radius:3px;background:#FFF;color:#6F6F6F;
  border:1px solid #C9C9C9;letter-spacing:.2px;flex:none;font-variant-numeric:tabular-nums}
.rtag.live{background:var(--green-l);color:var(--green);border-color:#B7CDBB}
.rtag.done{background:#F1F1F1;color:#6F6F6F}
.rtag.draft{color:#A3A3A3;border-style:dashed;background:#FFF}
.chip{font-size:10.5px;border:1px solid #DEDEDE;border-radius:3px;padding:2px 7px;color:#6F6F6F;background:#FFF}
.chip.b{border-color:var(--blue);color:var(--blue-d);background:var(--blue-l)}

/* ══ 曲线 ══ */
.trends{display:flex;gap:6px;flex:none}
.trend{flex:1;border:1px solid #C9C9C9;border-radius:3px;padding:7px 11px;background:#F1F1F1;text-align:left}
.trend:hover{border-color:var(--blue)}
.trend.off{opacity:.42}
.trend .t{font-size:10.5px;color:var(--mut);display:flex;align-items:center;gap:6px}
.trend .t i{width:14px;height:3px;display:block;border-radius:2px}
.trend .v{font-size:18px;font-weight:500;margin-top:2px}
.chartbox{flex:1;border:1px solid #C9C9C9;border-radius:3px;min-height:0;background:#FFF;padding:5px;overflow:hidden}
.chartbox svg{width:100%;height:100%;display:block}
.cbar{height:48px;border:1px solid #C9C9C9;border-radius:3px;display:flex;align-items:center;gap:8px;
  padding:0 11px;flex:none;background:#F9F9F9;font-size:12px;color:#6F6F6F}

/* ══ 序列 ══ */
.steps{display:flex;gap:6px;flex:none}
.step{flex:1;height:72px;border:1px solid #C9C9C9;border-radius:3px;background:#F1F1F1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:#3D3D3D}
.step:hover{border-color:var(--blue)}
.step .no{font-size:9.5px;color:var(--mut)}
.step .ty{font-size:14px;font-weight:700}
.step .pm{font-size:10px;color:var(--mut)}
.step.empty .ty{color:var(--mut2);font-weight:400}
.step.done{background:#EAEAEA;color:var(--mut)}
.step.active{border:2px solid var(--blue);background:var(--blue-l)}
.step.active .ty{color:var(--blue-d)}
.step.err{border:2px solid var(--red);background:#FBEAE7}
.step.err .ty{color:var(--red)}

/* ══ 弹窗 ══ */
.mask{position:absolute;inset:0;background:rgba(26,26,26,.42);display:flex;align-items:center;justify-content:center;z-index:50}
.dlg{background:#FFF;border:1px solid #6F6F6F;border-radius:4px;box-shadow:0 8px 28px rgba(0,0,0,.3);min-width:360px;overflow:hidden}
.dh{background:var(--blue-d);color:#FFF;padding:12px 16px;font-size:14.5px;font-weight:500}
.dh .sm{font-size:11.5px;opacity:.7;font-weight:400;display:block;margin-top:2px}
.db{padding:15px 18px}
.df{padding:11px 18px 15px;display:flex;gap:9px;justify-content:flex-end;border-top:1px solid var(--line)}
.kp{display:grid;grid-template-columns:repeat(3,66px);gap:7px}
.kp button{height:47px;border:1px solid #C9C9C9;background:#F1F1F1;border-radius:3px;font-size:18px}
.kp button:hover{background:#EAEAEA}
.kdisp{height:54px;border:2px solid var(--blue);border-radius:3px;background:var(--blue-l);display:flex;
  align-items:center;justify-content:flex-end;padding:0 14px;font-size:26px;font-weight:500;margin-bottom:9px;color:var(--blue-d)}
.kdisp u{text-decoration:none;font-size:13px;color:#8E8E8E;margin-left:6px}
.krange{font-size:11px;color:var(--mut);margin-bottom:11px}
.frow{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px}
.frow label{width:96px;flex:none;color:#6F6F6F}
.frow input,.frow select{flex:1;height:34px;border:1px solid #C9C9C9;border-radius:3px;padding:0 9px;
  font-size:13px;font-family:var(--sans);background:#FFF}
.frow em{font-style:normal;font-size:11.5px;color:var(--mut);width:56px;flex:none}
.opt{border:1px solid #C9C9C9;border-radius:3px;padding:12px 14px;margin-bottom:9px;display:flex;
  gap:11px;align-items:flex-start;font-size:13px;line-height:1.6;background:#F9F9F9;text-align:left;width:100%}
.opt:hover{border-color:var(--blue);background:var(--blue-l)}
.opt i{width:16px;height:16px;border:2px solid var(--mut2);border-radius:50%;flex:none;margin-top:2px;position:relative}
.opt.on{border-color:var(--blue);background:var(--blue-l)}
.opt.on i{border-color:var(--blue)} .opt.on i::after{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--blue)}
.opt small{display:block;font-size:11px;color:var(--mut)}
.tygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tygrid button{height:56px;border:1px solid #C9C9C9;background:#F1F1F1;border-radius:3px;font-size:13.5px;line-height:1.3}
.tygrid button:hover{border-color:var(--blue);background:var(--blue-l)}
.tygrid button small{display:block;font-size:10px;color:var(--mut)}

/* ══ 报警 ══ */
.alarm{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(196,43,28,.32)}
.abox{width:620px;background:#FFF;border:2px solid var(--red);border-radius:5px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.36)}
.abox .ah{background:var(--red);color:#FFF;padding:13px 18px;display:flex;align-items:center;gap:12px;
  animation:blink 1.1s steps(2,start) infinite}
@keyframes blink{50%{background:#9B2115}}
.abox .ah b{font-size:18px;letter-spacing:.6px}
.abox .ah span{margin-left:auto;font-size:12px;opacity:.86}
.abox .ab2{padding:17px 18px}
.abox h4{font-size:15px;margin-bottom:8px}
.abox p{font-size:13px;color:#6F6F6F;line-height:1.75;margin-bottom:11px}
.abox ol{margin-left:19px;font-size:12.5px;color:#6F6F6F;line-height:1.9}
.abox .af{padding:0 18px 16px;display:flex;gap:9px;justify-content:flex-end}

.hint{position:absolute;left:50%;bottom:15px;transform:translateX(-50%);background:rgba(26,26,26,.92);
  color:#FFF;font-size:12px;padding:8px 17px;border-radius:16px;z-index:70;opacity:0;transition:opacity .25s;
  pointer-events:none;white-space:nowrap}
.hint.show{opacity:1}
@keyframes sp{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.2)}}
.paddle{transform-origin:109.5px 233.5px;animation:sp 1.2s ease-in-out infinite}
.paddle.stop{animation:none}

/* ════════════════ 高度层级系统 ════════════════ */
:root{
  --e1:0 1px 2px rgba(36,36,36,.055), 0 1px 1px rgba(36,36,36,.04);
  --e2:0 4px 14px rgba(36,36,36,.115), 0 1px 3px rgba(36,36,36,.075);
  --e3:0 20px 50px rgba(21,21,21,.28), 0 6px 16px rgba(21,21,21,.15);
  --inset:inset 0 1px 2px rgba(36,36,36,.10);
  --ez:cubic-bezier(.22,.61,.36,1);
}
/* L1 · 面板浮于底板 */
.zhead,.cd,.pnl,.foot,.artbox,.chartbox,.cbar,.modes,.step,.trend,.hd,.ptab{
  box-shadow:var(--e1);
  transition:box-shadow .16s var(--ez), transform .16s var(--ez), border-color .14s var(--ez);
}
/* L2 · 可点元素悬停上浮 */
.zhead:hover,.step:hover,.trend:hover,.ab:hover,.ptab:hover{
  transform:translateY(-1.5px); box-shadow:var(--e2); border-color:var(--blue);
}
.zhead:active,.step:active,.trend:active,.ab:active{transform:translateY(0);box-shadow:var(--e1)}
.lrow{transition:box-shadow .16s var(--ez), transform .16s var(--ez), border-color .14s var(--ez)}
.lrow:hover{transform:translateY(-1px);box-shadow:var(--e1)}
/* 按钮 · 微渐变 + 上浮 + 按下回弹 */
.bt,.hbtn,.tbn,.kp button,.tygrid button{
  background-image:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,0));
  box-shadow:var(--e1); transition:.15s var(--ez);
}
.bt:hover,.hbtn:hover,.kp button:hover,.tygrid button:hover{transform:translateY(-1px);box-shadow:var(--e2)}
.bt:active,.hbtn:active,.kp button:active,.tygrid button:active{transform:translateY(1px);box-shadow:none;filter:brightness(.97)}
.bt.pri,.hbtn.go{background-image:linear-gradient(180deg,#6FC3C9,var(--blue));
  box-shadow:0 2px 6px rgba(79,177,184,.32), var(--e1)}
.bt.pri:hover,.hbtn.go:hover{box-shadow:0 6px 16px rgba(79,177,184,.36)}
.bt[disabled]{box-shadow:none;background-image:none;transform:none!important}
/* 输入类 · 凹陷 */
.vb,.frow input,.frow select,.ssel{box-shadow:var(--inset);transition:.15s var(--ez)}
.vb:hover{box-shadow:var(--inset),0 0 0 3px rgba(79,177,184,.10);border-color:var(--blue);transform:none}
.vb.edit{box-shadow:var(--inset),0 0 0 3px rgba(200,138,0,.14)}
.kdisp{box-shadow:inset 0 2px 4px rgba(33,95,101,.14)}
/* 深色读数面板 · 嵌入式仪表窗 */
.rpanel{
  background:linear-gradient(180deg,#4C4C4C 0,#4C4C4C 42%,#4A4A4A 100%);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.07),
             inset 0 -1px 0 rgba(0,0,0,.3), 0 1px 2px rgba(36,36,36,.10);
}
.vbx{background:linear-gradient(180deg,#C9C9C9,#C9C9C9);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.26), 0 1px 0 rgba(255,255,255,.10)}
.vbx.off{background:linear-gradient(180deg,#A3A3A3,#A3A3A3)}
.vbx.hi{background:linear-gradient(180deg,#FFF,#F6F6F6);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.10), 0 0 0 3px rgba(79,177,184,.28)}
/* 装置窗 · 观察窗质感 */
.artbox{background:linear-gradient(180deg,#FDFDFD,#F9F9F9);
  box-shadow:inset 0 1px 3px rgba(36,36,36,.07), var(--e1)}
.art{border-radius:3px}
/* 标签页 · 选中页浮起并与内容框连通 */
.tab{transition:.15s var(--ez)}
.tab:hover{transform:translateY(-1px)}
.tab.on{box-shadow:inset 0 2px 0 var(--blue), 0 -3px 8px rgba(36,36,36,.07);transform:none}
/* 侧栏 */
.rail{box-shadow:1px 0 3px rgba(36,36,36,.07)}
.rbtn{transition:.14s var(--ez)}
.rbtn.on{box-shadow:inset 0 0 0 1px rgba(255,255,255,.14), 0 2px 8px rgba(79,177,184,.34)}
.rstate{box-shadow:0 2px 8px rgba(33,95,101,.28)}
/* 气泡 · 浮在装置图之上 */
.bub{box-shadow:var(--e1);transition:.16s var(--ez)}
.bub.hi{box-shadow:0 2px 10px rgba(79,177,184,.20), var(--e1)}
/* 开关 · 手柄投影 */
.sw{box-shadow:var(--e1)} 
.sw i{box-shadow:inset 0 1px 2px rgba(0,0,0,.22)}
.sw i::after{box-shadow:0 1px 2px rgba(0,0,0,.3), 0 0 0 .5px rgba(0,0,0,.06)}
/* 浮层 */
.mask{backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.dlg{box-shadow:var(--e3)}
.abox{box-shadow:0 24px 60px rgba(120,20,12,.34), 0 8px 20px rgba(0,0,0,.22)}
.hint{box-shadow:0 6px 20px rgba(0,0,0,.3)}
/* 进度条 · 内陷轨道 */
.pg{box-shadow:inset 0 1px 2px rgba(36,36,36,.13)}
.pg b{box-shadow:0 0 6px rgba(79,177,184,.4)}
/* 当前步骤 */
.step.active{box-shadow:0 0 0 3px rgba(79,177,184,.16), var(--e1)}


/* ════ 精修 ════ */
.rstate{margin-top:6px;letter-spacing:1.4px;font-size:11px;border-radius:3px}
.tab{letter-spacing:.3px}
.topbar{padding-left:6px}
.zhead .row1 b,.hd .row1 b{letter-spacing:.2px}
.vbx{letter-spacing:.3px}
.vb b{font-variant-numeric:tabular-nums;letter-spacing:.4px}
.vbx,.now b,.zhead .row1 .rt,.hd .row1 .rt em{font-variant-numeric:tabular-nums}
.trend .v{font-variant-numeric:tabular-nums}
.lim span{letter-spacing:.2px}
.modes button.on{box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 1px 3px rgba(79,177,184,.3)}
.modes button{transition:.15s var(--ez)}
.ptab .pc{transition:.15s var(--ez)}
.ptab:hover .pc{border-color:var(--blue);color:var(--blue)}
.foot{background:linear-gradient(180deg,var(--pnh1),var(--pnh2))}
.cbar{background:linear-gradient(180deg,var(--pnh1),var(--pnh2))}
.pnh{background:linear-gradient(180deg,var(--pnh1),var(--pnh2));letter-spacing:.3px}
.dh{letter-spacing:.3px}
.art{background:radial-gradient(ellipse at 50% 42%,#FFF 0,#F9F9F9 100%)}

},o);}
const S={artOpen:true,page:'ov',tab:{ov:'app',z:'ctl'},zi:0,modal:null,alarm:null,tick:0,
  sys:{dhcp:false,ip:'192.168.1.42',mask:'255.255.255.0',dt:'2026-08-28 14:26',tz:'UTC+8 中国标准时间',

function rail(){

      <svg viewBox="0 0 24 24">${ICON[k]}</svg></button>`;};

}

    </div></section>`;

const SEGMIN=26, TRACK=1084, TLPAD=53;
function segLay(ds){
  const tot=ds.reduce((a,b)=>a+b,0)||1, nat=ds.map(d=>d/tot*TRACK);
  const zip=nat.map(v=>v<SEGMIN);
  const fx=zip.reduce((a,c)=>a+(c?SEGMIN:0),0);
  const rw=Math.max(0,TRACK-fx-(ds.length-1)), rn=nat.reduce((a,v,i)=>a+(zip[i]?0:v),0);
  return nat.map((v,i)=>({w:zip[i]?SEGMIN:(rn?v/rn*rw:0),zip:zip[i]}));
}
function segX(L,ds,t){let a=0,x=0;
  for(let i=0;i<ds.length;i++){
    if(t<=a+ds[i]) return x+L[i].w*(ds[i]?(t-a)/ds[i]:0);
    a+=ds[i]; x+=L[i].w+1;}
  return x;}
function tickStep(tot){for(const v of [300,600,900,1800,3600,7200,10800]) if(tot/v<=8) return v; return 21600;}
const tkLbl=t=>t?(t<3600?(t/60|0)+' min':(t/3600).toFixed(t%3600?1:0)+' h'):'0';

function seqOv(z){
  const st=z.seq.filter(Boolean);
  if(!st.length) return `<div class="pnl" style="flex:none"><div class="pnh">通道 ${z.id} · ${z.name}
    <span class="sm">手动模式</span></div>
    <div class="tlnone">未编排方案 · 手动模式下不显示时序</div></div>`;
  const ds=st.map(x=>x.d), tot=ds.reduce((a,b)=>a+b,0), L=segLay(ds);
  const cur=z.seqRun?Math.min(z.elapsed,tot):null;
  const nz=L.filter(x=>x.zip).length;
  const seg=(cls,txt,i)=>`<div class="seg ${cls}${L[i].zip?' zip':''}${z.seqRun&&i<z.seqIdx?' past':''}"
      style="width:${L[i].w.toFixed(1)}px" title="步骤 ${i+1} · ${st[i].t} · ${st[i].p} · ${hhmmss(ds[i])}"
      >${L[i].zip?'':txt}</div>`;
  let ax='';
  for(let t=0,ss=tickStep(tot);t<=tot;t+=ss){const x=segX(L,ds,t);
    ax+=`<i style="left:${x.toFixed(1)}px"></i><b style="left:${x.toFixed(1)}px${x>TRACK-24?';transform:translateX(-92%)':''}">${tkLbl(t)}</b>`;}
  return `<div class="pnl" style="flex:none"><div class="pnh">通道 ${z.id} · ${z.name}
    <span class="sm">${st.length} 步 · 总时长 ${hhmmss(tot)}${nz?` · ${nz} 个短步骤已压缩`:''}</span>
    <span class="rt"><span class="rtag ${z.seqRun?'live':'draft'}">${z.seqRun?`步骤 ${z.seqIdx+1}/${st.length}`:'未启动'}</span></span></div>
  <div class="tl">
    <div class="tlr"><span class="tlk">温度</span><div class="tlt">${st.map((x,i)=>seg('tp',x.ev,i)).join('')}</div></div>
    <div class="tlr"><span class="tlk">搅拌</span><div class="tlt">${st.map((x,i)=>seg('rp',x.rpm+' rpm',i)).join('')}</div></div>
    <div class="tlr"><span class="tlk"></span><div class="tla">${ax}</div></div>
    ${cur!==null?`<b class="tlc" style="left:${(TLPAD+segX(L,ds,cur)).toFixed(1)}px;top:11px;height:57px"></b>`:''}
  </div></div>`;
}

/* ══════════ 曲线 ══════════ */
function chart(series,lo,hi,H=400,meta){
  const W=1140,L=48,R=16,T=30,B=30;
  const n=series[0].d.length, x=i=>L+i/(n-1)*(W-L-R), y=v=>H-B-(v-lo)/(hi-lo)*(H-T-B);
  const s0=meta&&meta.s0||0, s0m=meta&&meta.startMin||0, sm=meta&&meta.spanMin!=null?meta.spanMin:180;
  let g='';
  for(let i=0;i<=6;i++){const yy=T+i*(H-T-B)/6;
    g+=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="#EEEEEE"/>
      <text x="${L-8}" y="${yy}" text-anchor="end" dominant-baseline="central" font-size="10.5" fill="#A3A3A3">${(hi-(hi-lo)*i/6).toFixed(0)}</text>`;}
  for(let i=0;i<=6;i++){const xx=L+i*(W-L-R)/6,tm=s0m+i*sm/6;
    g+=`<text x="${xx}" y="${H-B+15}" text-anchor="middle" font-size="10.5" fill="#A3A3A3">${sm<36?tm.toFixed(1):Math.round(tm)} min</text>`;}
  const ln=series.map(s=>`<polyline points="${s.d.map((v,i)=>x(i)+','+y(v)).join(' ')}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round"/>`).join('');

function defFields(t,prev){const rpm=(prev&&prev.rpm)||450;
  if(t==='Wait')return {hold:30,rpm};
  if(t==='R')  return {tgt:300,mode:'time',val:5,rpm:300};
  if(t==='Dose')return {tgt:10,mode:'rate',val:1.2,rpm};
  if(t==='TrTj')return {tgt:10,mode:'time',val:30,rpm};
  return {tgt:40,mode:'rate',val:0.5,rpm,expn:1};}
function ensureF(s){ if(s.f)return; const n=t=>parseFloat(String(t).replace('−','-')),ps=(s.p||'').split(' · ');
  if(s.t==='Wait')s.f={hold:Math.max(1,Math.round((s.d||1800)/60)),rpm:s.rpm};
  else{const rate=/\/min/.test(ps[1]||'');s.f={tgt:isNaN(n(ps[0]))?40:n(ps[0]),mode:rate?'rate':'time',
    val:isNaN(n(ps[1]))?(rate?0.5:30):Math.abs(n(ps[1])),rpm:s.rpm,expn:1};}}
function regenSeq(z){let cur=22; const fm=v=>String(+(+v).toFixed(2)).replace('-','−');
  z.seq.forEach(s=>{if(!s)return; ensureF(s); const f=s.f;
    if(s.t==='Wait'){s.d=Math.max(60,f.hold*60);s.p=hhmmss(s.d);s.ev=fm(cur)+' ℃';}
    else if(s.t==='Tr'||s.t==='Tj'){
      s.d=f.mode==='rate'?Math.max(60,Math.abs(f.tgt-cur)/Math.max(.01,f.val)*60):Math.max(60,f.val*60);
      s.p=fm(f.tgt)+' ℃ · '+(f.mode==='rate'?fm(f.val)+' ℃/min':fm(f.val)+' min');
      s.ev=fm(f.tgt)+' ℃'; cur=f.tgt;}
    else if(s.t==='R'){s.d=f.mode==='rate'?Math.max(60,300/Math.max(1,f.val)*60):Math.max(60,f.val*60);
      s.p=fm(f.tgt)+' rpm · '+(f.mode==='rate'?fm(f.val)+' rpm/min':fm(f.val)+' min');s.ev=fm(f.tgt)+' rpm';}
    else if(s.t==='TrTj'){s.d=Math.max(60,(f.mode==='time'?f.val:30)*60);
      s.p='ΔT '+fm(f.tgt)+' K · '+(f.mode==='rate'?fm(f.val)+' K/min':fm(f.val)+' min');s.ev='ΔT '+fm(f.tgt)+' K';}
    else{s.d=f.mode==='rate'?Math.max(60,f.tgt/Math.max(.01,f.val)*60):Math.max(60,f.val*60);
      s.p=fm(f.tgt)+' mL · '+(f.mode==='rate'?fm(f.val)+' mL/min':fm(f.val)+' min');s.ev=fm(f.tgt)+' mL';}
    if(f.rpm!==undefined)s.rpm=f.rpm;});}

    case 'sample': S.modal={t:'sample'};break;
    case 'tcolors': S.modal={t:'tcolors'};break;
    case 'timeMode': toast('时间轴显示已切换（实验时间 / 时钟）');break;
    default: S.modal={t:'info',title:'提示',body:'原型演示：此处会打开对应的命名 / 选择 / 确认流程。复制方案时必须重新命名，且运行中的通道不可接收。'};
  }
  render();
});
function log(z,k,v){const d=new Date();z.log.unshift([d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'),k,v]);z.log=z.log.slice(0,20);}

/* ══════════ 仿真 ══════════ */
setInterval(()=>{ S.tick++;
  if(S.sys.exporting>0&&!(--S.sys.exporting))toast('导出完成，已写入 U 盘');
  S.zones.forEach(z=>{
    z.elapsed++;
    if(z.seqRun||z.on.temp){
      const tgt=z.mode==='Tj'?z.set.tj:z.set.tr;
      z.tr+=(tgt-z.tr)*.012+(Math.random()-.5)*.06;
      z.tj+=((z.on.temp?tgt+(z.mode==='Tj'?0:(z.tr<tgt?6:-5)):z.tc)-z.tj)*.02+(Math.random()-.5)*.05;
      if(z.dose.phLink&&z.dose.rate>0){z.dose.total+=z.dose.rate/60;z.ph+=.0009;} else z.ph+=(Math.random()-.5)*.004;
      if(z.on.stir)z.torque=Math.round(16+Math.random()*5);
      if(z.seqRun&&S.tick%25===0){const n=z.seq.filter(Boolean).length;z.seqIdx=(z.seqIdx+1)%n;}
    } else { z.tr+=(z.tc+3-z.tr)*.004; z.tj+=(z.tc+2.5-z.tj)*.004; }
    z.tc+=(Math.random()-.5)*.03;
    z.hist.tr.push(z.tr);z.hist.tj.push(z.tj);z.hist.ph.push(z.ph);z.hist.rpm.push(z.rpm);
    ['tr','tj','ph','rpm'].forEach(k=>{if(z.hist[k].length>200)z.hist[k].shift()});
    z.notes.forEach(m=>m.i--); z.notes=z.notes.filter(m=>m.i>0);
  });
  if(!S.modal&&!S.alarm) render();
},1000);
function fit(){const el=document.querySelector('.fit');
  const d=document.getElementById('dev'), bare=d&&d.classList.contains('bare');
  const W=bare?1280:1372, H=bare?720:836;
  el.style.transform='scale('+Math.min(1,(innerWidth-32)/W,(innerHeight-32)/H)+')';}
addEventListener('keydown',e=>{if(e.key==='b'||e.key==='B'){document.getElementById('dev').classList.toggle('bare');fit();}});
addEventListener('resize',fit); fit();
render();
</script>
