<svg xmlns="http://www.w3.org/2000/svg" viewBox="160 0 40 100">
<!-- 搅拌头套上工位后的形态：盖在主机图（rd105.svg）工位 1 那只灰色电机头的位置上
     （电机 x=168~192 / y=24~82、卡盘 173,82 14×14、顶上一个插头），坐标沿用主机坐标系，
     摆放时按 viewBox 原点对回主机（BenchDock.SnapPosition）；工位 2 用同一张图整体右移 200。
     颜色跟独立形态一致：红壳、米色卡盘。轴和桨叶主机图里本来就有（data-paddle 会摆），这里不重画。 -->
<g fill="none" stroke="#4A4A4A" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
  <rect x="176" y="14" width="8" height="10" rx="1.5" fill="#9A9A9A" stroke-width="1.2"/>
  <rect x="168" y="24" width="24" height="58" rx="4" fill="#B8322E" stroke-width="2.6"/>
  <rect x="171" y="27" width="4" height="52" rx="2" fill="#D9534F" stroke="none"/>
  <g stroke="#4A4A4A" stroke-width="1" fill="#7A1F1C">
    <rect x="173" y="34" width="2.4" height="18" rx="1.2"/><rect x="177" y="34" width="2.4" height="18" rx="1.2"/>
    <rect x="181" y="34" width="2.4" height="18" rx="1.2"/><rect x="185" y="34" width="2.4" height="18" rx="1.2"/>
  </g>
  <circle cx="186" cy="66" r="2.2" fill="#7A1F1C" stroke-width="1"/>
  <circle cx="186" cy="74" r="2.2" fill="#7A1F1C" stroke-width="1"/>
  <rect x="173" y="82" width="14" height="14" rx="2.5" fill="#E3DCC8" stroke-width="1.2"/>
</g>
</svg>
