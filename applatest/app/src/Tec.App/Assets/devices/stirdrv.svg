<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 300">
<!-- 顶置式搅拌头（现场那支，2026-11-09 用户照片）：红色圆筒无刷电机壳、两圈散热槽、顶上航空插头，
     下面米色卡盘收成锥形，细不锈钢轴到底一片小桨。设备库与台面上的独立形态。
     驱动器板子（爱控 AQMD）装在柜子里，操作人认的是这支头，所以台面画它。
     线稿规矩同别的设备：描边 #4A4A4A；壳体红 #B8322E / 高光 #D9534F，卡盘米色 #E3DCC8。 -->
<g fill="none" stroke="#4A4A4A" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
  <!-- 航空插头 -->
  <rect x="26" y="2" width="12" height="10" rx="2" fill="#9A9A9A" stroke-width="1.2"/>
  <path d="M29 5h6M29 8h6" stroke="#4A4A4A" stroke-width="1"/>
  <!-- 电机壳（上段，带散热槽） -->
  <rect x="12" y="12" width="40" height="86" rx="7" fill="#B8322E" stroke-width="2.4"/>
  <rect x="18" y="16" width="6" height="78" rx="3" fill="#D9534F" stroke="none"/>
  <g stroke="#4A4A4A" stroke-width="1.2" fill="#7A1F1C">
    <rect x="17" y="30" width="4" height="30" rx="2"/><rect x="24" y="30" width="4" height="30" rx="2"/>
    <rect x="31" y="30" width="4" height="30" rx="2"/><rect x="38" y="30" width="4" height="30" rx="2"/>
    <rect x="45" y="30" width="4" height="30" rx="2"/>
  </g>
  <g fill="#7A1F1C" stroke="#4A4A4A" stroke-width="1">
    <circle cx="20" cy="22" r="1.6"/><circle cx="28" cy="22" r="1.6"/><circle cx="36" cy="22" r="1.6"/><circle cx="44" cy="22" r="1.6"/>
    <circle cx="20" cy="70" r="1.6"/><circle cx="28" cy="70" r="1.6"/><circle cx="36" cy="70" r="1.6"/><circle cx="44" cy="70" r="1.6"/>
  </g>
  <!-- 电机壳（下段，两个螺孔） -->
  <rect x="12" y="98" width="40" height="60" rx="4" fill="#B8322E" stroke-width="2.4"/>
  <rect x="18" y="100" width="6" height="56" rx="3" fill="#D9534F" stroke="none"/>
  <circle cx="40" cy="116" r="4" fill="#7A1F1C" stroke-width="1.2"/>
  <circle cx="40" cy="134" r="4" fill="#7A1F1C" stroke-width="1.2"/>
  <!-- 米色卡盘：直段 + 锥段 + 轴套 -->
  <rect x="12" y="158" width="40" height="36" rx="3" fill="#E3DCC8" stroke-width="2.4"/>
  <path d="M12 194 20 214H44L52 194Z" fill="#E3DCC8" stroke-width="1.8"/>
  <rect x="24" y="214" width="16" height="22" rx="2" fill="#E3DCC8" stroke-width="1.8"/>
  <rect x="24" y="224" width="16" height="3" fill="#4A4A4A" stroke="none"/>
  <!-- 搅拌轴 + 小桨 -->
  <path d="M32 236v54" stroke-width="2.6"/>
  <path d="M24 290h16" stroke-width="2.6"/>
  <path d="M24 290 20 296M40 290 44 296" stroke-width="2"/>
</g>
</svg>
