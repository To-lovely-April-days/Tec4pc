<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 140" width="176" height="140">
  <title>双通道平行反应工作站</title>
  <defs>
    <linearGradient id="a23_Glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#88a5b1"/><stop offset="0.18" stop-color="#abcbd9"/>
      <stop offset="0.42" stop-color="#9bbac8"/><stop offset="0.66" stop-color="#8aa2b0"/>
      <stop offset="0.86" stop-color="#8193a1"/><stop offset="1" stop-color="#6c7b88"/></linearGradient>
    <linearGradient id="a23_Lcd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa0a9"/><stop offset="0.07" stop-color="#90a4b6"/>
      <stop offset="0.20" stop-color="#a3bcd0"/><stop offset="0.36" stop-color="#aec9e4"/>
      <stop offset="0.52" stop-color="#9bbbd8"/><stop offset="0.70" stop-color="#82a8c4"/>
      <stop offset="0.82" stop-color="#70a4c0"/><stop offset="0.93" stop-color="#7ba6c4"/>
      <stop offset="1" stop-color="#8995aa"/></linearGradient>
    <linearGradient id="a23_Deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4c7c8"/><stop offset="1" stop-color="#adb1b2"/></linearGradient>

    <!-- 釜内液体。上浅下深，看着有厚度；做动画时改这条的 y/height 就是液位 -->
    <linearGradient id="a23_Liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fc7e8" stop-opacity="0.92"/>
      <stop offset="0.45" stop-color="#4ea8d6" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#2f7fae"/></linearGradient>

    <filter id="a23_Soft2" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="1.7"/></filter>
  </defs>

  <g transform="translate(-22,-24)">
    <!-- 后挡板 + 顶部管口 -->
    <rect x="38.4" y="38.4" width="140.8" height="35.8" fill="#f4f6f8" stroke="#5b5f63" stroke-width="1.7"/>
    <line x1="43.6" y1="39.6" x2="43.6" y2="73.4" stroke="#83878b" stroke-width="1.2"/>
    <line x1="173.6" y1="39.6" x2="173.6" y2="73.4" stroke="#83878b" stroke-width="1.2"/>
    <rect x="38.4" y="37.6" width="140.8" height="2.4" fill="#5a5a5a"/>
    <g fill="#54565a"><rect x="63" y="34.2" width="7.6" height="5" rx="2.2"/>
      <rect x="74.8" y="33.8" width="8.4" height="5.4" rx="2.4"/>
      <rect x="145.4" y="34.2" width="7.6" height="5" rx="2.2"/>
      <rect x="132.8" y="33.8" width="8.4" height="5.4" rx="2.4"/></g>
    <rect x="88.6" y="28.6" width="6.6" height="10.6" rx="2.1" fill="#616163"/>
    <rect x="90.4" y="30.8" width="3" height="7" rx="1.2" fill="#7a7a7f"/>
    <rect x="120.8" y="28.6" width="6.6" height="10.6" rx="2.1" fill="#616163"/>
    <rect x="122.6" y="30.8" width="3" height="7" rx="1.2" fill="#7a7a7f"/>

    <!-- 搅拌电机塔 -->
    <rect x="100.6" y="27.6" width="15.8" height="41.4" rx="3.2" fill="#5d5d5d" stroke="#454749" stroke-width="0.9"/>
    <rect x="102.5" y="29.6" width="3.4" height="3.2" rx="1.2" fill="#9a9ea1"/>
    <rect x="111.1" y="29.6" width="3.4" height="3.2" rx="1.2" fill="#9a9ea1"/>
    <circle cx="108.4" cy="36.4" r="3.4" fill="#9aa0a4" stroke="#454749" stroke-width="0.9"/>
    <rect x="102.7" y="41.8" width="11.6" height="25.6" rx="2.4" fill="#d1d3d5" stroke="#454749" stroke-width="0.9"/>
    <rect x="38.2" y="72.4" width="141.2" height="2.8" fill="#5c6064"/>

    <!-- 机身 + 台面 -->
    <rect x="26.9" y="78.6" width="163.2" height="71.4" rx="1.4" fill="#f9f9fb" stroke="#6d7175" stroke-width="1.8"/>
    <rect x="27.4" y="79.2" width="162.2" height="15" fill="url(#a23_Deck)"/>
    <rect x="26.6" y="76.8" width="163.8" height="2.8" fill="#6a6e72"/>
    <rect x="26.9" y="93.4" width="162.2" height="2.2" fill="#6e7276"/>
    <rect x="88" y="74.6" width="2.2" height="4.6" fill="#4a4e52"/>
    <rect x="126.6" y="74.6" width="2.2" height="4.6" fill="#4a4e52"/>
    <path d="M34 125.5V103.4Q34 100.9 36.6 100.9H40.8" fill="none" stroke="#bcbcbc" stroke-width="2.8"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

    <!-- 运行辉光：主题紫。三层实心椭圆叠出由内到外的衰减——
         径向渐变在我们的渲染路径上画不出来，叠椭圆是稳的。
         通道没在跑就整块不画（data-run） -->
    <g data-run="1">
      <ellipse cx="69.5" cy="101" rx="33" ry="29" fill="#b9a9e0" opacity="0.20"/>
      <ellipse cx="69.5" cy="101" rx="23" ry="20" fill="#8a6fc4" opacity="0.22"/>
      <ellipse cx="69.5" cy="101" rx="14" ry="12" fill="#6b4fa8" opacity="0.24"/>
    </g>
    <g data-run="2">
      <ellipse cx="147.5" cy="101" rx="33" ry="29" fill="#b9a9e0" opacity="0.20"/>
      <ellipse cx="147.5" cy="101" rx="23" ry="20" fill="#8a6fc4" opacity="0.22"/>
      <ellipse cx="147.5" cy="101" rx="14" ry="12" fill="#6b4fa8" opacity="0.24"/>
    </g>

    <!-- ── 通道 1 反应釜 ────────────────────────────────────────────
         夹套 → 内腔 → 玻璃釜 → 液体 → 搅拌轴与桨叶 → 高光。
         做动画时认这几个 data 名：liquid（液位）、stir（桨叶）、bubble（气泡） -->
    <g id="vessel1">
      <rect x="51.5" y="81" width="36" height="41" rx="4" fill="#8f8f9b" stroke="#4e4e58" stroke-width="2.1"/>
      <rect x="57" y="86" width="25" height="31" rx="3" fill="#38414e"/>
      <rect x="60" y="88" width="19" height="27" rx="3" fill="url(#a23_Glass)"/>

      <rect x="61.2" y="99.4" width="16.6" height="14.4" rx="2.4" fill="url(#a23_Liquid)" data-liquid="1"/>
      <ellipse cx="69.5" cy="99.6" rx="8.3" ry="1.5" fill="#bfe6f6" opacity="0.75" data-meniscus="1"/>
      <circle cx="65.4" cy="107.2" r="0.9" fill="#dff2fb" opacity="0.55" data-bubble="1"/>
      <circle cx="73.2" cy="110.4" r="0.7" fill="#dff2fb" opacity="0.45" data-bubble="1"/>

      <rect x="68.6" y="88" width="1.8" height="20.4" rx="0.9" fill="#c8ccd0" stroke="#7d8288" stroke-width="0.4"/>
      <g data-stir="1">
        <ellipse cx="69.5" cy="108.6" rx="6.2" ry="1.5" fill="#dfe3e7" stroke="#8b9096" stroke-width="0.5"/>
        <rect x="63.7" y="105.6" width="2.6" height="3.4" rx="0.8" fill="#cfd4d8" stroke="#8b9096" stroke-width="0.4"/>
        <rect x="72.7" y="105.6" width="2.6" height="3.4" rx="0.8" fill="#cfd4d8" stroke="#8b9096" stroke-width="0.4"/>
      </g>

      <rect x="62.2" y="90" width="2.4" height="21" rx="1.2" fill="#ffffff" opacity="0.32"/>
      <rect x="55" y="117.6" width="29" height="3.4" rx="1.7" fill="#010101" data-tint="1"/>
    </g>

    <!-- ── 通道 2 反应釜（与通道 1 同构，整体右移 78）────────────── -->
    <g id="vessel2">
      <rect x="129.5" y="81" width="36" height="41" rx="4" fill="#8f8f9b" stroke="#4e4e58" stroke-width="2.1"/>
      <rect x="135" y="86" width="25" height="31" rx="3" fill="#38414e"/>
      <rect x="138" y="88" width="19" height="27" rx="3" fill="url(#a23_Glass)"/>

      <rect x="139.2" y="99.4" width="16.6" height="14.4" rx="2.4" fill="url(#a23_Liquid)" data-liquid="2"/>
      <ellipse cx="147.5" cy="99.6" rx="8.3" ry="1.5" fill="#bfe6f6" opacity="0.75" data-meniscus="2"/>
      <circle cx="143.4" cy="107.2" r="0.9" fill="#dff2fb" opacity="0.55" data-bubble="2"/>
      <circle cx="151.2" cy="110.4" r="0.7" fill="#dff2fb" opacity="0.45" data-bubble="2"/>

      <rect x="146.6" y="88" width="1.8" height="20.4" rx="0.9" fill="#c8ccd0" stroke="#7d8288" stroke-width="0.4"/>
      <g data-stir="2">
        <ellipse cx="147.5" cy="108.6" rx="6.2" ry="1.5" fill="#dfe3e7" stroke="#8b9096" stroke-width="0.5"/>
        <rect x="141.7" y="105.6" width="2.6" height="3.4" rx="0.8" fill="#cfd4d8" stroke="#8b9096" stroke-width="0.4"/>
        <rect x="150.7" y="105.6" width="2.6" height="3.4" rx="0.8" fill="#cfd4d8" stroke="#8b9096" stroke-width="0.4"/>
      </g>

      <rect x="140.2" y="90" width="2.4" height="21" rx="1.2" fill="#ffffff" opacity="0.32"/>
      <rect x="133" y="117.6" width="29" height="3.4" rx="1.7" fill="#020202" data-tint="2"/>
    </g>

    <ellipse cx="69.5" cy="124" rx="18" ry="1.4" fill="#93a2a9" opacity="0.4" filter="url(#a23_Soft2)"/>
    <ellipse cx="147.5" cy="124" rx="18" ry="1.4" fill="#93a2a9" opacity="0.4" filter="url(#a23_Soft2)"/>

    <!-- 底座 + 抱夹 -->
    <rect x="28.8" y="150.4" width="159.6" height="8.2" fill="#f5f5f5" stroke="#5c5e60" stroke-width="1.5"/>
    <rect x="29.6" y="154.6" width="158" height="3.9" fill="#5b5d5f"/>
    <rect x="41" y="132" width="17.4" height="17.6" fill="#bfc0be" stroke="#6a6e72" stroke-width="2"/>
    <rect x="157.6" y="132" width="17.4" height="17.6" fill="#bfc0be" stroke="#6a6e72" stroke-width="2"/>
    <circle cx="51.8" cy="144.6" r="5.2" fill="#666a6e"/><circle cx="51.8" cy="144.6" r="2" fill="#e6e8e9"/>
    <circle cx="164.4" cy="144.6" r="5.2" fill="#666a6e"/><circle cx="164.4" cy="144.6" r="2" fill="#e6e8e9"/>

    <!-- 操作台 -->
    <rect x="55.8" y="128.2" width="105.6" height="30.8" rx="1.6" fill="#e9ebec" stroke="#5a5e62" stroke-width="1.8"/>
    <rect x="61.4" y="130.4" width="94.4" height="16.6" rx="1.2" fill="#f2f4f6" stroke="#4e5256" stroke-width="2"/>
    <rect x="66" y="132.3" width="84.4" height="10.9" rx="0.8" fill="url(#a23_Lcd)"/>
    <rect x="67" y="133.4" width="13.5" height="8.7" rx="0.6" fill="#8892a2" opacity="0.5"/>
    <rect x="47.4" y="146.8" width="122.8" height="2.6" fill="#585c60"/>
    <rect x="53.4" y="149.4" width="110.8" height="10" fill="#f2f3f3"/>
    <rect x="53.8" y="151.8" width="109.8" height="2.4" fill="#5e6266"/>
    <rect x="54.2" y="157.3" width="108.6" height="1.9" fill="#666a6e"/>
  </g>
</svg>
